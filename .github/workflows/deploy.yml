# FTP static hosting (e.g. shared hosting / Host Africa).
# Requires STATIC_EXPORT=true so `next build` outputs to ./out/
#
# Tradeoff: Next.js `output: "export"` does NOT ship /api/* routes.
# Admin, contact API, etc. need a Node host (Vercel, Railway) or a separate backend.

name: Deploy to Host Africa

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & FTP deploy
    runs-on: ubuntu-latest

    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      # Same app deployed on Vercel/Node — static FTP site calls APIs here (required for /admin, contact, blog data)
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_ADMIN_IMAGES_DATA_URL_ONLY: ${{ secrets.NEXT_PUBLIC_ADMIN_IMAGES_DATA_URL_ONLY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production API origin for admin
        shell: bash
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is missing."
            echo "Set it to your Node/Vercel deployment origin so /admin can call /api in production."
            echo "Example: https://your-project.vercel.app"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (outputs to ./out/)
        # Stashes src/app/api — Route Handlers are not supported with output: export
        run: npm run build:static

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          dangerous-clean-slate: true
